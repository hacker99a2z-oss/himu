services:
  - type: web
    name: farm-city
    env: node
    rootDir: farm-fresh-upgrade-main
    buildCommand: npm install && npm run build
    startCommand: node .output/server/index.mjs
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TON_WALLET_MNEMONIC
        sync: false
      - key: TON_WALLET_VERSION
        sync: false
      - key: TONCENTER_API_KEY
        sync: false
