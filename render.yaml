services:
  - type: web
    name: farm-city
    env: node
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run build:backend
    startCommand: npm run start:backend
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TON_WALLET_MNEMONIC
        sync: false
      - key: TON_WALLET_VERSION
        sync: false
      - key: TONCENTER_API_KEY
        sync: false
      - key: ADSGRAM_REWARD_SECRET
        sync: false
      - key: PAYOUT_CRON_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: CHANNEL_URL
        sync: false
      - key: PAYMENTS_PROOF_URL
        sync: false
      - key: CONTACT_SUPPORT_URL
        sync: false
      - key: SUPPORT_URL
        sync: false
      - key: INTRO_VIDEO
        sync: false
